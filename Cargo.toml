[package]
name = "Fuchs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
yahoo_finance_api = "4.1.0"
time = "0.3.47"
ta = "0.5.0"
fin-primitives = { version = "4.0.1", default-features = false, features = ["indicators"] }
anyhow = "1.0.102"
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
dotenvy = "0.15"
sha2 = "0.10"
feed-rs = "2"